name: Build buildkit-rootless

on:
  pull_request:
    paths: ['.github/workflows/build-buildkit-rootless.yml', 'buildkit-rootless/**']
  push:
    branches: [main]
    paths: ['.github/workflows/build-buildkit-rootless.yml', 'buildkit-rootless/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=docker depName=moby/buildkit
      BUILDKIT_VERSION: v0.31.2-rootless
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push buildkit-rootless
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: buildkit-rootless
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/bl4ko/buildkit-rootless:latest
            ghcr.io/bl4ko/buildkit-rootless:${{ env.BUILDKIT_VERSION }}
          cache-from: type=gha,scope=buildkit-rootless
          cache-to: type=gha,scope=buildkit-rootless,mode=max
