name: Build caddy-cloudflare

on:
  pull_request:
    paths: ['.github/workflows/build-caddy-cloudflare.yml', 'caddy-cloudflare/**']
  push:
    branches: [main]
    paths: ['.github/workflows/build-caddy-cloudflare.yml', 'caddy-cloudflare/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=docker depName=caddy
      CADDY_VERSION: 2.11.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push caddy-cloudflare
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: caddy-cloudflare
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/bl4ko/caddy-cloudflare:latest
            ghcr.io/bl4ko/caddy-cloudflare:${{ env.CADDY_VERSION }}
          cache-from: type=gha,scope=caddy-cloudflare
          cache-to: type=gha,scope=caddy-cloudflare,mode=max
