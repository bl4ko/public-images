name: Build caddy-cloudflare

on:
  pull_request:
    paths: ['.github/workflows/build-caddy-cloudflare.yml', 'caddy-cloudflare/**']
  push:
    branches: [main]
    paths: ['.github/workflows/build-caddy-cloudflare.yml', 'caddy-cloudflare/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=docker depName=caddy
      CADDY_VERSION: 2.11.3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push caddy-cloudflare
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: caddy-cloudflare
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/bl4ko/caddy-cloudflare:latest
            ghcr.io/bl4ko/caddy-cloudflare:${{ env.CADDY_VERSION }}
          cache-from: type=gha,scope=caddy-cloudflare
          cache-to: type=gha,scope=caddy-cloudflare,mode=max
