name: Build clickhouse

on:
  pull_request:
    paths: ['.github/workflows/build-clickhouse.yml', 'clickhouse/**']
  push:
    branches: [main]
    paths: ['.github/workflows/build-clickhouse.yml', 'clickhouse/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=docker depName=docker.io/clickhouse/clickhouse-server
      CLICKHOUSE_VERSION: 26.8.36.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: tag
        run: echo "n=$(git rev-list --count HEAD -- clickhouse)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push clickhouse
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: clickhouse
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          sbom: true
          tags: |
            ghcr.io/bl4ko/clickhouse:${{ env.CLICKHOUSE_VERSION }}-${{ steps.tag.outputs.n }}
          cache-from: type=gha,scope=clickhouse
          cache-to: type=gha,scope=clickhouse,mode=max
