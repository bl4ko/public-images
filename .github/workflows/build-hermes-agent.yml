name: Build hermes-agent

on:
  pull_request:
    paths: ['.github/workflows/build-hermes-agent.yml', 'hermes-agent/**']
  push:
    branches: [main]
    paths: ['.github/workflows/build-hermes-agent.yml', 'hermes-agent/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hermes-agent
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: hermes-agent
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/bl4ko/hermes-agent:latest
          cache-from: type=gha,scope=hermes-agent
          cache-to: type=gha,scope=hermes-agent,mode=max
