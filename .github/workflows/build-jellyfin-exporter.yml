name: Build jellyfin-exporter

on:
  pull_request:
    paths: ['.github/workflows/build-jellyfin-exporter.yml', 'jellyfin-exporter/**']
  push:
    branches: [main]
    paths: ['.github/workflows/build-jellyfin-exporter.yml', 'jellyfin-exporter/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JELLYFIN_EXPORTER_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push jellyfin-exporter
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: jellyfin-exporter
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/bl4ko/jellyfin-exporter:latest
            ghcr.io/bl4ko/jellyfin-exporter:${{ env.JELLYFIN_EXPORTER_VERSION }}
          cache-from: type=gha,scope=jellyfin-exporter
          cache-to: type=gha,scope=jellyfin-exporter,mode=max
