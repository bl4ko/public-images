name: Build olympus-ci-flutter

on:
  pull_request:
    paths: ['.github/workflows/build-olympus-ci-flutter.yml', 'olympus-ci-flutter/**']
  push:
    branches: [main]
    paths: ['.github/workflows/build-olympus-ci-flutter.yml', 'olympus-ci-flutter/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: tag
        run: |
          echo "n=$(git rev-list --count HEAD -- olympus-ci-flutter)" >> "$GITHUB_OUTPUT"
          echo "flutter=$(awk -F= '/^ARG FLUTTER_VERSION=/ {print $2}' olympus-ci-flutter/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push olympus-ci-flutter
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: olympus-ci-flutter
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/bl4ko/olympus-ci-flutter:${{ steps.tag.outputs.flutter }}-${{ steps.tag.outputs.n }}
