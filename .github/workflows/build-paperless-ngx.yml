name: Build paperless-ngx

on:
  pull_request:
    paths: ['.github/workflows/build-paperless-ngx.yml', 'paperless-ngx/**']
  push:
    branches: [main]
    paths: ['.github/workflows/build-paperless-ngx.yml', 'paperless-ngx/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=docker depName=ghcr.io/paperless-ngx/paperless-ngx
      PAPERLESS_VERSION: "2.20.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push paperless-ngx
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: paperless-ngx
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/bl4ko/paperless-ngx:latest
            ghcr.io/bl4ko/paperless-ngx:${{ env.PAPERLESS_VERSION }}
          cache-from: type=gha,scope=paperless-ngx
          cache-to: type=gha,scope=paperless-ngx,mode=max
